# ---------------------------------------------------------------------------
# Build / daemon settings
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# NeoGradle/MDG is not reliably compatible with the configuration cache
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
loader_version_range=[4,)

# ---------------------------------------------------------------------------
# Mod properties
# ---------------------------------------------------------------------------
mod_id=fairymoon3_maid_list
mod_name=Maid List
mod_license=MIT
mod_version=0.1.2.1
mod_group_id=com.fairymoon3.maidlist

# Build artifact file name (decoupled from mod id, so renaming does not break item ids)
archive_name=maid_list

# Touhou Little Maid jar (compile only; ships with the modpack)
tlm_jar=touhoulittlemaid-1.5.3-neoforge+mc1.21.1.jar

# Optional integration target: Foxdream (compile only, guarded by ModList at runtime)
foxdream_jar=foxdream-0.9.0-r234.jar
